# ============================================
# Groww Weekly Review Pulse — Configuration
# ============================================
# See docs/architecture.md §5.2 for schema reference.

product:
  name: groww
  play_store_id: com.nextbillion.groww
  display_name: Groww

ingestion:
  window_weeks: 10            # Rolling window for review collection
  max_reviews: 5000           # Safety cap per run
  language: en                # Filter to English reviews

embedding:
  provider: sentence-transformers   # Local model (Groq does not offer embeddings)
  model: all-MiniLM-L6-v2
  batch_size: 128

clustering:
  umap:
    n_neighbors: 15
    n_components: 5
    min_dist: 0.0
  hdbscan:
    min_cluster_size: 10
    min_samples: 5

llm:
  provider: groq
  model: llama-3.1-8b-instant
  max_tokens_per_run: 50000   # Cost guard
  temperature: 0.3

preprocessing:
  pii_scrub: true
  min_review_length: 10       # Characters; skip very short reviews

delivery:
  google_doc_id: "1ilURGzK5iBWIhbRE2myjw_VQvPP8iv22rpucBQAbm7E"   # Target doc ID
  stakeholders:
    - bhardwajashish9718@gmail.com
    - bhardwajashish9717@gmail.com
  draft_only: true            # Staging default; set false for production
  email_subject_template: "Groww Review Pulse — Week {iso_week}"

mcp_server:
  url: "https://web-production-131a3.up.railway.app/sse"

run_log:
  path: data/run_log.json
