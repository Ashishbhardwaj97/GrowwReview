name: Weekly Review Pulse

on:
  schedule:
    # Run every Monday at 09:00 IST (03:30 UTC)
    - cron: '30 3 * * 1'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no delivery side effects)'
        required: false
        type: boolean
        default: false
      draft_only:
        description: 'Run in draft-only mode (do not send email)'
        required: false
        type: boolean
        default: true
      force:
        description: 'Force run (ignore idempotency checks)'
        required: false
        type: boolean
        default: false

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Run Pipeline (Scheduled)
        if: github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || '' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # The config.yaml defines if draft_only is true or false
          python src/cli.py --product groww --week auto

      - name: Run Pipeline (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || '' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          ARGS="--product groww --week auto"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.draft_only }}" = "true" ]; then
            ARGS="$ARGS --draft-only"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python src/cli.py $ARGS
